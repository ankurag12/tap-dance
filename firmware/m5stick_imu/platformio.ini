; PlatformIO project — M5StickC Plus (ESP32-PICO-D4) micro-ROS client.
;
; Arduino framework as a HAL *under PlatformIO* (professional build system,
; not the hobby Arduino IDE). micro-ROS via micro_ros_platformio; M5Unified
; provides the IMU/LCD drivers (used from milestone 2 on).
;
; Transport: WiFi/UDP to the micro-ROS agent on the Jetson.
; Fill WiFi + agent details in include/secrets.h (copy include/secrets.h.example;
; secrets.h is gitignored — never commit credentials).
[env:m5stickc_plus]
platform = espressif32
board = m5stick-c            ; M5StickC Plus uses the ESP32-PICO; M5Unified detects the Plus at runtime
framework = arduino
monitor_speed = 115200

lib_deps =
    https://github.com/micro-ROS/micro_ros_platformio
    m5stack/M5Unified

; micro_ros_platformio options
board_microros_distro = humble
board_microros_transport = wifi

; NOTE: micro_ros_platformio can be picky about the espressif32 platform version.
; If the first build fails to compile the micro-ROS library, we'll pin e.g.
;   platform = espressif32 @ 6.5.0
